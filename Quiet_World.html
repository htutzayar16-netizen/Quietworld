
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiet World | A Peaceful Place</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: #101b2b;
    overflow: hidden;
    transition: background 2s;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(
        180deg,
        #101b2b,
        #263b50,
        #526b75
    );
    transition: background 2s;
}

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .2; transform: scale(.7); }
    to { opacity: 1; transform: scale(1.5); }
}

.moon {
    position: absolute;
    top: 12%;
    right: 15%;
    width: 90px;
    height: 90px;
    background: #f5eacb;
    border-radius: 50%;
    box-shadow: 0 0 50px #f5eacb88;
    animation: moonGlow 4s infinite alternate;
}

@keyframes moonGlow {
    to { box-shadow: 0 0 100px #fff3c5; }
}

.mountains {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 38%;
    background: #172e32;
    clip-path: polygon(0 55%, 18% 5%, 36% 60%,
    56% 12%, 75% 65%, 100% 15%, 100% 100%, 0 100%);
}

.mountains.back {
    height: 45%;
    background: #263d45;
    opacity: .65;
    transform: translateY(-20px);
}

.rain {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.drop {
    position: absolute;
    width: 1px;
    height: 65px;
    background: linear-gradient(transparent, #d9efff88);
    animation: falling linear infinite;
}

@keyframes falling {
    from { transform: translateY(-100px); }
    to { transform: translateY(110vh); }
}

.content {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 650px;
    text-align: center;
    z-index: 5;
}

.small {
    letter-spacing: 6px;
    font-size: 11px;
    color: #c1d4d7;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 300;
    letter-spacing: 4px;
    margin-bottom: 20px;
}

.message {
    font-size: 16px;
    line-height: 2;
    color: #d5e0e2;
    min-height: 65px;
}

button {
    margin: 15px 6px;
    padding: 12px 22px;
    border: 1px solid #ffffff66;
    border-radius: 30px;
    background: #ffffff12;
    color: white;
    cursor: pointer;
    transition: .4s;
    backdrop-filter: blur(10px);
}

button:hover {
    background: #ffffff35;
    transform: translateY(-3px);
}

.footer {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: #d0dddd99;
    z-index: 5;
}

.firefly {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #eaffb5;
    box-shadow: 0 0 15px #eaffb5;
    animation: float 7s infinite ease-in-out;
}

@keyframes float {
    0%,100% { transform: translate(0,0); opacity: .2; }
    50% { transform: translate(35px,-80px); opacity: 1; }
}

@media(max-width:600px) {
    .moon {
        width: 65px;
        height: 65px;
    }

    .content { top: 40%; }
    .message { font-size: 14px; }
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="rain" id="rain"></div>

    <div class="mountains back"></div>
    <div class="mountains"></div>

    <div class="content">
        <div class="small">A WORLD JUST FOR YOU</div>

        <h1>Quiet World.</h1>

        <p class="message" id="message">
            Not everyone needs a crowded world.<br>
            Some souls find happiness in silence.
        </p>

        <button onclick="changeMood()">Change Atmosphere</button>
        <button onclick="newQuote()">Another Thought</button>
        <button onclick="toggleRain()">Toggle Rain</button>
    </div>

    <div class="footer">
        ENJOY THE SILENCE · FIND YOUR PEACE
    </div>

</div>

<script>
const stars = document.getElementById("stars");
const rain = document.getElementById("rain");
const scene = document.getElementById("scene");

for (let i = 0; i < 100; i++) {
    let star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 75 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    stars.appendChild(star);
}

function createRain() {
    rain.innerHTML = "";
    for (let i = 0; i < 100; i++) {
        let drop = document.createElement("div");
        drop.className = "drop";
        drop.style.left = Math.random() * 100 + "%";
        drop.style.animationDuration = (0.5 + Math.random()) + "s";
        drop.style.animationDelay = Math.random() * 3 + "s";
        rain.appendChild(drop);
    }
}

createRain();

for (let i = 0; i < 18; i++) {
    let fly = document.createElement("div");
    fly.className = "firefly";
    fly.style.left = Math.random() * 100 + "%";
    fly.style.top = (40 + Math.random() * 55) + "%";
    fly.style.animationDelay = Math.random() * 5 + "s";
    scene.appendChild(fly);
}

const moods = [
    ["#101b2b", "#263b50", "#526b75"],
    ["#251d3a", "#57436d", "#a17c91"],
    ["#102d35", "#28605d", "#88a99a"],
    ["#30243d", "#754d68", "#c18a92"],
    ["#182b48", "#315b7c", "#83a5bd"],
    ["#382d26", "#80634d", "#c3a17b"]
];

let moodIndex = 0;

function changeMood() {
    moodIndex = (moodIndex + 1) % moods.length;
    let m = moods[moodIndex];

    scene.style.background =
        `linear-gradient(180deg, ${m[0]}, ${m[1]}, ${m[2]})`;
}

const quotes = [
    "Silence is not loneliness. Sometimes, it is freedom.",
    "You don't have to be loud to be unforgettable.",
    "A quiet mind can hold an entire universe.",
    "Some people recharge under the stars, not in crowds.",
    "It's okay to enjoy your own little world.",
    "Peace is a beautiful thing to protect.",
    "Being different is not something to hide.",
    "Sometimes, doing nothing is everything.",
    "Stay alone and Stay quietly is enough for you.",
    "Breath...Everything is fine, don't worry.",
    "Be kindful to people even animals",
    "Be quiet is good for you, Cuz the world is noisy."
];

function newQuote() {
    const message = document.getElementById("message");
    const quote = quotes[Math.floor(Math.random() * quotes.length)];

    message.style.opacity = 0;

    setTimeout(() => {
        message.innerHTML = quote;
        message.style.opacity = 1;
    }, 400);
}

document.getElementById("message").style.transition = "opacity .5s";

let rainOn = true;

function toggleRain() {
    rainOn = !rainOn;
    rain.style.display = rainOn ? "block" : "none";
}
</script>

</body>
</html>
